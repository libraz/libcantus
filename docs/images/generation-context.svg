<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What one generated part is written under</title>
  <desc id="dsc">A generation context on the left holds the seed, three complexity dials drawn as slider tracks, a separate difficulty ceiling, and the tempo and instrument. An arrow feeds that context into a column of generators — progression, motif, rhythm, drums, bass and counter-melody. A card on the right states that the same seed, algorithm version, parameters and build give the same notes every run, and a note explains that random draws are addressed by position rather than by call order.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>
  <text class="h" x="24" y="42">What one generated part is written under</text>

  <!-- the context -->
  <rect class="grp" x="24" y="52" width="396" height="186" rx="10"/>
  <text class="lbl" x="40" y="70">GenerationContext</text>

  <rect class="chip" x="40" y="76" width="364" height="22" rx="6"/>
  <text class="h" x="52" y="91">seed</text>
  <text class="s" x="92" y="91">one number for the whole project</text>

  <rect class="chip" x="40" y="104" width="364" height="72" rx="6"/>
  <text class="lbl" x="52" y="121">three dials, each added on top of the last</text>

  <text class="h" x="52" y="139">rhythmic complexity</text>
  <path class="rule" d="M240,135 H380"/>
  <path class="ln" d="M240,135 H317"/>
  <circle class="ah" cx="317" cy="135" r="3.5"/>

  <text class="h" x="52" y="155">harmonic complexity</text>
  <path class="rule" d="M240,151 H380"/>
  <path class="ln" d="M240,151 H338"/>
  <circle class="ah" cx="338" cy="151" r="3.5"/>

  <text class="h" x="52" y="171">ornament</text>
  <path class="rule" d="M240,167 H380"/>
  <path class="ln" d="M240,167 H289"/>
  <circle class="ah" cx="289" cy="167" r="3.5"/>

  <rect class="chip" x="40" y="182" width="364" height="22" rx="6"/>
  <text class="h" x="52" y="197">difficulty ceiling</text>
  <text class="s" x="186" y="197">a separate limit, not a dial</text>

  <rect class="chip" x="40" y="210" width="364" height="22" rx="6"/>
  <text class="h" x="52" y="225">tempo</text>
  <text class="s" x="96" y="225">and the instrument the part is written for</text>

  <!-- into the generators -->
  <path class="ln2" d="M428,145 H454" marker-end="url(#b)"/>

  <text class="lbl" x="540" y="70" text-anchor="middle">generators</text>
  <rect class="chip" x="460" y="76" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="91" text-anchor="middle">progression</text>
  <rect class="chip" x="460" y="101" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="116" text-anchor="middle">motif</text>
  <rect class="chip" x="460" y="126" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="141" text-anchor="middle">rhythm</text>
  <rect class="chip" x="460" y="151" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="166" text-anchor="middle">drums</text>
  <rect class="chip" x="460" y="176" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="191" text-anchor="middle">bass</text>
  <rect class="chip" x="460" y="201" width="160" height="22" rx="6"/>
  <text class="h" x="540" y="216" text-anchor="middle">counter-melody</text>

  <!-- determinism -->
  <rect class="card" x="636" y="76" width="300" height="86" rx="10"/>
  <text class="h" x="652" y="104">the same notes, every run</text>
  <text class="s" x="652" y="126">same seed, same algorithm version,</text>
  <text class="s" x="652" y="142">same parameters, same build</text>

  <rect class="alt" x="460" y="246" width="476" height="50" rx="10"/>
  <text class="s" x="476" y="268">a random draw is addressed by its position, not by the order the calls</text>
  <text class="s" x="476" y="286">happened in — so changing one parameter does not redraw everything after it</text>

  <text class="s" x="480" y="314" text-anchor="middle">A project records its seed and the algorithm version, so a result can be produced again later.</text>
</svg>
