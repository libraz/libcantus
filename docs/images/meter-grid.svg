<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Bars, beats, and the unit of time</title>
  <desc id="dsc">Two strips. The first is two bars of four four, with heavy bar lines at beats 0, 4 and 8 and light gridlines on every beat, numbered 0 to 7 underneath; above each beat a bar shows its metric weight, tallest on the first beat of the bar, next tallest on the third, shortest on the second and fourth. A dashed region before beat 0 marks where a pickup lives. The second strip is one bar of six eight, six cells bracketed into two groups of three with the two dotted-quarter pulses marked above, and the same positions counted underneath in quarter-note beats: 0, 0.5, 1, 1.5, 2, 2.5, with the bar ending at 3.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="320" rx="12"/>

  <text class="h" x="24" y="34">Bars, beats, and the unit of time</text>

  <!-- strip 1: 4/4 -->
  <text class="h" x="36" y="62">4/4</text>
  <text class="lbl" x="884" y="62" text-anchor="end">metric weight — where the meter puts its stresses</text>

  <rect class="fill1" x="214" y="76" width="20" height="42"/>
  <rect class="fill1" x="302" y="102" width="20" height="16"/>
  <rect class="fill1" x="390" y="90" width="20" height="28"/>
  <rect class="fill1" x="478" y="102" width="20" height="16"/>
  <rect class="fill1" x="566" y="76" width="20" height="42"/>
  <rect class="fill1" x="654" y="102" width="20" height="16"/>
  <rect class="fill1" x="742" y="90" width="20" height="28"/>
  <rect class="fill1" x="830" y="102" width="20" height="16"/>

  <line class="rule" x1="180" y1="122" x2="884" y2="122"/>
  <line class="rule" x1="180" y1="152" x2="884" y2="152"/>
  <line class="rule" x1="180" y1="122" x2="180" y2="152" style="stroke-width:2.5"/>
  <line class="rule" x1="268" y1="122" x2="268" y2="152"/>
  <line class="rule" x1="356" y1="122" x2="356" y2="152"/>
  <line class="rule" x1="444" y1="122" x2="444" y2="152"/>
  <line class="rule" x1="532" y1="122" x2="532" y2="152" style="stroke-width:2.5"/>
  <line class="rule" x1="620" y1="122" x2="620" y2="152"/>
  <line class="rule" x1="708" y1="122" x2="708" y2="152"/>
  <line class="rule" x1="796" y1="122" x2="796" y2="152"/>
  <line class="rule" x1="884" y1="122" x2="884" y2="152" style="stroke-width:2.5"/>

  <text class="s" x="180" y="166" text-anchor="middle">0</text>
  <text class="s" x="268" y="166" text-anchor="middle">1</text>
  <text class="s" x="356" y="166" text-anchor="middle">2</text>
  <text class="s" x="444" y="166" text-anchor="middle">3</text>
  <text class="s" x="532" y="166" text-anchor="middle">4</text>
  <text class="s" x="620" y="166" text-anchor="middle">5</text>
  <text class="s" x="708" y="166" text-anchor="middle">6</text>
  <text class="s" x="796" y="166" text-anchor="middle">7</text>

  <rect class="seam" x="136" y="122" width="44" height="30" rx="3"/>
  <text class="s" x="36" y="100">a pickup lives at</text>
  <text class="s" x="36" y="113">a negative beat</text>

  <!-- strip 2: 6/8 -->
  <text class="h" x="36" y="190">6/8</text>

  <rect class="fill1" x="192" y="188" width="20" height="20"/>
  <rect class="fill1" x="324" y="188" width="20" height="20"/>
  <text class="s" x="360" y="194">dotted-quarter</text>
  <text class="s" x="360" y="206">pulses</text>

  <rect class="chip" x="180" y="212" width="44" height="30"/>
  <rect class="chip" x="224" y="212" width="44" height="30"/>
  <rect class="chip" x="268" y="212" width="44" height="30"/>
  <rect class="chip" x="312" y="212" width="44" height="30"/>
  <rect class="chip" x="356" y="212" width="44" height="30"/>
  <rect class="chip" x="400" y="212" width="44" height="30"/>

  <path class="ln" d="M181,248 L181,254 L310,254 L310,248"/>
  <path class="ln" d="M314,248 L314,254 L443,254 L443,248"/>

  <text class="s" x="180" y="270" text-anchor="middle">0</text>
  <text class="s" x="224" y="270" text-anchor="middle">0.5</text>
  <text class="s" x="268" y="270" text-anchor="middle">1</text>
  <text class="s" x="312" y="270" text-anchor="middle">1.5</text>
  <text class="s" x="356" y="270" text-anchor="middle">2</text>
  <text class="s" x="400" y="270" text-anchor="middle">2.5</text>
  <text class="s" x="444" y="270" text-anchor="middle">3</text>

  <text class="lbl" x="470" y="228">a compound meter groups its eighths in threes;</text>
  <text class="lbl" x="470" y="242">the unit the API counts is still the quarter-note beat</text>

  <text class="s" x="480" y="294" text-anchor="middle">Bars and beats are positions in the model; seconds appear only when a tempo is applied.</text>
</svg>
