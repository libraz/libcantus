  </g>
  <text class="s" x="740" y="188">C メジャーでは D7。G のドミナントを、</text>
  <text class="s" x="740" y="204">C ではなく向かう先の調で読む。</text>

  <!-- function -->
  <rect class="grp" x="24" y="288" width="296" height="114" rx="10"/>
  <text class="lbl" x="48" y="312">トニック</text>
  <rect class="chip" x="48" y="336" width="44" height="26" rx="6"/>
