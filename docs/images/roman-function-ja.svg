  <rect class="bg" x="0" y="0" width="960" height="452" rx="12"/>

  <text class="h" x="24" y="42">度数・ローマ数字・機能</text>
  <text class="lbl" x="936" y="42" text-anchor="end">上にコードネーム、下にローマ数字と度数</text>

