  <rect class="chip" x="408" y="336" width="44" height="26" rx="6"/>
  <text class="rn" x="430" y="354" text-anchor="middle">IV</text>
  <text class="s" x="356" y="386">ドミナントへ進む</text>

  <rect class="grp" x="640" y="288" width="296" height="114" rx="10"/>
  <text class="lbl" x="664" y="312">ドミナント</text>
  <rect class="chip" x="664" y="336" width="44" height="26" rx="6"/>
  <text class="rn" x="686" y="354" text-anchor="middle">V</text>
  <rect class="chip" x="716" y="336" width="44" height="26" rx="6"/>
  <text class="rn" x="738" y="354" text-anchor="middle">vii°</text>
  <text class="s" x="664" y="386">トニックへ引き戻す</text>

  <text class="s" x="480" y="432" text-anchor="middle">機能的な読みは調的な素材を前提とします。ある音階がそれを許すかどうかは <tspan class="mono">supportsFunctionalHarmony</tspan> が答えます。</text>
