  <text class="s" x="48" y="252">大文字＝長三和音、小文字＝短三和音、° ＝減三和音</text>

  <!-- secondary dominant -->
  <rect class="card" x="720" y="64" width="216" height="208" rx="10"/>
  <text class="h" x="740" y="94">V/V — 副属和音</text>
  <text class="sym" x="850" y="112" text-anchor="middle">D7</text>
