<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">和音は3度の積み重ね</title>
  <desc id="dsc">3つのパネルに分かれた図です。1つ目は高音部譜表に4つの和音を並べ、1段ごとに3度を上へ足していきます。C は C4 E4 G4、C7 は B♭4 を足し、C9 は D5 を、C9(♯11) は F♯5 を足し、加わった音程を各和音の下に書きます。2つ目は同じ C・E・G を積み方だけ変えた3つで、基本形、E が最低音の第1転回形、G が最低音の第2転回形をそれぞれ C、C/E、C/G と示します。3つ目は C を根音とする5つの性質、長三和音・短三和音・減三和音・増三和音・属七の和音を、根音からの音程とともに譜例で並べます。</desc>

