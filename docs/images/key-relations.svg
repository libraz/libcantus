<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How two keys are related</title>
  <desc id="dsc">C major sits at the centre with four spokes to its closest neighbours: the relative minor A minor, the parallel minor C minor, the dominant G major and the subdominant F major, each with a one-line gloss. A card underneath shows a pivot chord — D minor is ii in C major and vi in F major — as the place a modulation can turn.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="360" rx="12"/>
  <text class="h" x="24" y="42">How two keys are related</text>

  <!-- spokes -->
  <path class="ln" d="M380,132 L308,98" marker-end="url(#a)"/>
  <path class="ln" d="M380,162 L308,194" marker-end="url(#a)"/>
  <path class="ln" d="M580,132 L652,98" marker-end="url(#a)"/>
  <path class="ln" d="M580,162 L652,194" marker-end="url(#a)"/>

  <!-- centre -->
  <rect class="card" x="380" y="116" width="200" height="60" rx="10"/>
  <text class="h" x="480" y="142" text-anchor="middle">C major</text>
  <text class="s" x="480" y="160" text-anchor="middle">no sharps, no flats</text>

  <!-- relative minor -->
  <rect class="chip" x="24" y="54" width="280" height="88" rx="8"/>
  <text class="lbl" x="40" y="78">relative minor</text>
  <text class="h" x="40" y="102">A minor</text>
  <text class="s" x="40" y="122">the same key signature, a different tonic</text>

  <!-- parallel minor -->
  <rect class="chip" x="24" y="150" width="280" height="88" rx="8"/>
  <text class="lbl" x="40" y="174">parallel minor</text>
  <text class="h" x="40" y="198">C minor</text>
  <text class="s" x="40" y="218">the same tonic, a different</text>
  <text class="s" x="40" y="232">signature — three flats</text>

  <!-- dominant -->
  <rect class="chip" x="656" y="54" width="280" height="88" rx="8"/>
  <text class="lbl" x="672" y="78">dominant</text>
  <text class="h" x="672" y="102">G major</text>
  <text class="s" x="672" y="122">one step sharpwards: one sharp</text>

  <!-- subdominant -->
  <rect class="chip" x="656" y="150" width="280" height="88" rx="8"/>
  <text class="lbl" x="672" y="174">subdominant</text>
  <text class="h" x="672" y="198">F major</text>
  <text class="s" x="672" y="218">one step flatwards: one flat</text>

  <!-- pivot -->
  <rect class="alt" x="24" y="244" width="912" height="68" rx="10"/>
  <text class="lbl" x="44" y="266">pivot</text>
  <rect class="chip" x="44" y="274" width="236" height="36" rx="6"/>
  <text class="h" x="162" y="297" text-anchor="middle">D minor is ii in C major</text>
  <path class="ln2" d="M290,292 H322" marker-end="url(#b)"/>
  <rect class="chip" x="330" y="274" width="236" height="36" rx="6"/>
  <text class="h" x="448" y="297" text-anchor="middle">D minor is vi in F major</text>
  <rect class="chip" x="600" y="274" width="316" height="36" rx="6"/>
  <text class="s" x="758" y="288" text-anchor="middle">a chord both keys own is where</text>
  <text class="s" x="758" y="302" text-anchor="middle">a modulation can turn</text>

  <text class="s" x="480" y="334" text-anchor="middle">Distance is counted in steps around the circle of fifths; the closer two keys sit, the more material they share.</text>
</svg>
