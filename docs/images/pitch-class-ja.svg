<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">ピッチ、ピッチクラス、綴り</title>
  <desc id="dsc">C4 から C5 までの 1 オクターブの鍵盤を描き、両端の C を MIDI 60 と 72 として示しています。その下では同じ 12 鍵が 0 から 11 のピッチクラスの列にまとまり、60 も 72 もどちらも 0 になります。右側のカードでは、ピッチクラス 6 に F♯4 と G♭4 という 2 通りの綴りがあることを示しています。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .blk   { fill:#1f2328 }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .blk{fill:#6e7781}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>

  <text class="s" x="280" y="44" text-anchor="middle">オクターブ：12 半音離れた、同じ音名</text>
  <path class="ln" d="M 70 64 V 56 H 490 V 64"/>

  <rect class="chip" x="40" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="100" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="160" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="220" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="280" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="340" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="400" y="72" width="60" height="96" rx="3"/>
  <rect class="chip" x="460" y="72" width="60" height="96" rx="3"/>
  <rect class="blk" x="83" y="72" width="34" height="60" rx="3"/>
  <rect class="blk" x="143" y="72" width="34" height="60" rx="3"/>
  <rect class="blk" x="263" y="72" width="34" height="60" rx="3"/>
  <rect class="blk" x="323" y="72" width="34" height="60" rx="3"/>
  <rect class="blk" x="383" y="72" width="34" height="60" rx="3"/>

  <text class="mono" x="70" y="146" text-anchor="middle">60</text>
  <text class="mono" x="490" y="146" text-anchor="middle">72</text>
  <text class="s" x="70" y="160" text-anchor="middle">C</text>
  <text class="s" x="130" y="160" text-anchor="middle">D</text>
  <text class="s" x="190" y="160" text-anchor="middle">E</text>
  <text class="s" x="250" y="160" text-anchor="middle">F</text>
  <text class="s" x="310" y="160" text-anchor="middle">G</text>
  <text class="s" x="370" y="160" text-anchor="middle">A</text>
  <text class="s" x="430" y="160" text-anchor="middle">B</text>
  <text class="s" x="490" y="160" text-anchor="middle">C</text>

  <path class="ln" d="M 490 168 V 182 H 32"/>
  <path class="ln" d="M 70 168 V 182 H 32 V 246 H 36" marker-end="url(#a)"/>

  <text class="lbl" x="40" y="214">ピッチクラス = MIDI ピッチ mod 12</text>
  <text class="s" x="516" y="214" text-anchor="end">60 も 72 もどちらも 0</text>

  <rect class="chip" x="40" y="230" width="36" height="28" rx="4"/>
  <rect class="fill1" x="40" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="58" y="248" text-anchor="middle">0</text>
  <rect class="chip" x="80" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="98" y="248" text-anchor="middle">1</text>
  <rect class="chip" x="120" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="138" y="248" text-anchor="middle">2</text>
  <rect class="chip" x="160" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="178" y="248" text-anchor="middle">3</text>
  <rect class="chip" x="200" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="218" y="248" text-anchor="middle">4</text>
  <rect class="chip" x="240" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="258" y="248" text-anchor="middle">5</text>
  <rect class="chip" x="280" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="298" y="248" text-anchor="middle">6</text>
  <rect class="chip" x="320" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="338" y="248" text-anchor="middle">7</text>
  <rect class="chip" x="360" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="378" y="248" text-anchor="middle">8</text>
  <rect class="chip" x="400" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="418" y="248" text-anchor="middle">9</text>
  <rect class="chip" x="440" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="458" y="248" text-anchor="middle">10</text>
  <rect class="chip" x="480" y="230" width="36" height="28" rx="4"/>
  <text class="s" x="498" y="248" text-anchor="middle">11</text>
  <text class="s" x="58" y="274" text-anchor="middle">C</text>

  <rect class="card" x="624" y="72" width="312" height="176" rx="8"/>
  <text class="lbl" x="640" y="98">同じ鍵、2 通りの綴り</text>
  <text class="lbl" x="640" y="124">ピッチクラス</text>
  <rect class="chip" x="640" y="132" width="52" height="52" rx="5"/>
  <text class="h" x="666" y="163" text-anchor="middle">6</text>
  <path class="ln" d="M 694 145 H 708" marker-end="url(#a)"/>
  <path class="ln" d="M 694 175 H 708" marker-end="url(#a)"/>
  <rect class="chip" x="712" y="132" width="208" height="26" rx="5"/>
  <text class="s" x="722" y="149">F♯4 — F を上げた音</text>
  <rect class="chip" x="712" y="162" width="208" height="26" rx="5"/>
  <text class="s" x="722" y="179">G♭4 — G を下げた音</text>
  <text class="s" x="640" y="214">どちらが正しいかは調によって決まる</text>
  <text class="s" x="640" y="228">G♭ は D♭ 長調に、F♯ は D 長調に属する</text>

  <text class="s" x="480" y="314" text-anchor="middle">ピッチ層より上の解析は 12 個のピッチクラスで行い、綴りは答えを左右する場面で保持します。</text>
</svg>
