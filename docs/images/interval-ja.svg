  <rect class="bg" x="0" y="0" width="960" height="360" rx="12"/>

  <text class="h" x="32" y="40">音程は度数と性質の組み合わせ</text>

  <!-- left: number and quality -->
  <rect class="grp" x="32" y="64" width="300" height="232" rx="10"/>
  <g class="glyph">
    <path class="staff" d="M52 104H228M52 113H228M52 122H228M52 131H228M52 140H228"/>
    <use href="#gClef" transform="translate(56.5 131) scale(0.04 -0.04)"/>
    <path class="bar" style="stroke-width:2" d="M227 104V140"/>
    <use href="#noteheadHalf" transform="translate(134.69 149) scale(0.04 -0.04)"/>
    <path class="ledger" d="M131.09 149h17.82"/>
    <path class="stem" d="M144.76 149V117.5"/>
    <use href="#noteheadHalf" transform="translate(184.69 140) scale(0.04 -0.04)"/>
    <path class="stem" d="M194.76 140V108.5"/>
  </g>
  <path class="ln" d="M140,162 L140,170 L190,170 L190,162"/>
  <path class="ln" d="M165,170 L165,178"/>
  <rect class="chip" x="133" y="178" width="64" height="26" rx="6"/>
  <text class="mono" x="165" y="195" text-anchor="middle">M3</text>

  <text class="h" x="52" y="230">度数：3度</text>
  <text class="s" x="52" y="246">両端を含めて音名を数える：C, D, E</text>
  <text class="h" x="52" y="268">性質：長（メジャー）</text>
  <text class="s" x="52" y="284">実際の距離は半音4つ分</text>

  <!-- right: six semitones, two intervals -->
  <rect class="grp" x="356" y="64" width="572" height="232" rx="10"/>
  <text class="lbl" x="386" y="88">同じ半音6つ分でも別の音程</text>
  <path class="warn" d="M376,100 L368,100 L368,250 L376,250"/>

  <g class="glyph">
    <path class="staff" d="M386 106H562M386 115H562M386 124H562M386 133H562M386 142H562"/>
    <use href="#gClef" transform="translate(390.5 133) scale(0.04 -0.04)"/>
    <path class="bar" style="stroke-width:2" d="M561 106V142"/>
    <use href="#noteheadHalf" transform="translate(449.69 151) scale(0.04 -0.04)"/>
    <path class="ledger" d="M446.09 151h17.82"/>
    <path class="stem" d="M459.76 151V119.5"/>
    <use href="#noteheadHalf" transform="translate(499.69 137.5) scale(0.04 -0.04)"/>
    <use href="#accidentalSharp" transform="translate(488.93 137.5) scale(0.04 -0.04)"/>
    <path class="stem" d="M509.76 137.5V106"/>
    <path class="staff" d="M386 178H562M386 187H562M386 196H562M386 205H562M386 214H562"/>
    <use href="#gClef" transform="translate(390.5 205) scale(0.04 -0.04)"/>
    <path class="bar" style="stroke-width:2" d="M561 178V214"/>
    <use href="#noteheadHalf" transform="translate(449.69 223) scale(0.04 -0.04)"/>
    <path class="ledger" d="M446.09 223h17.82"/>
    <path class="stem" d="M459.76 223V191.5"/>
    <use href="#noteheadHalf" transform="translate(499.69 205) scale(0.04 -0.04)"/>
    <use href="#accidentalFlat" transform="translate(489.75 205) scale(0.04 -0.04)"/>
    <path class="stem" d="M509.76 205V173.5"/>
  </g>

  <rect class="chip" x="580" y="111" width="52" height="26" rx="6"/>
  <text class="mono" x="606" y="128" text-anchor="middle">A4</text>
  <text class="s" x="652" y="128">増4度 — C から F を広げた形</text>

  <rect class="chip" x="580" y="183" width="52" height="26" rx="6"/>
  <text class="mono" x="606" y="200" text-anchor="middle">d5</text>
  <text class="s" x="652" y="200">減5度 — C から G を狭めた形</text>

  <text class="warnt" font-size="10.5" x="386" y="274">鍵盤上の距離は同じでも別の音程</text>

  <text class="s" x="480" y="330" text-anchor="middle"><tspan class="mono">parseInterval</tspan> はこの違いを保持します。声部書法と対位法のチェックがこの区別に依存するためです。</text>
</svg>
