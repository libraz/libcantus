<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Degrees, numerals, and function</title>
  <desc id="dsc">Seven columns show the numeral, the chord in C major and the degree number: I is C on degree one, ii is Dm on two, iii is Em on three, IV is F on four, V is G on five, vi is Am on six and vii diminished is Bdim on seven. Three bands below group them by function: tonic gathers I, iii and vi; predominant gathers ii and IV; dominant gathers V and vii diminished. A card on the right explains that V of V is a secondary dominant, D7 in C major.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>

  <text class="h" x="32" y="40">Degrees, numerals, and function</text>

  <!-- gutter labels for the seven columns -->
  <text class="lbl" x="32" y="90">numeral</text>
  <text class="lbl" x="32" y="112">chord in C major</text>
  <text class="lbl" x="32" y="132">degree</text>

  <!-- the seven diatonic columns -->
  <rect class="chip" x="176" y="64" width="56" height="82" rx="6"/>
  <text x="204" y="90" font-size="16" text-anchor="middle">I</text>
  <text class="h" x="204" y="112" text-anchor="middle">C</text>
  <text class="s" x="204" y="132" text-anchor="middle">1</text>

  <rect class="chip" x="244" y="64" width="56" height="82" rx="6"/>
  <text x="272" y="90" font-size="16" text-anchor="middle">ii</text>
  <text class="h" x="272" y="112" text-anchor="middle">Dm</text>
  <text class="s" x="272" y="132" text-anchor="middle">2</text>

  <rect class="chip" x="312" y="64" width="56" height="82" rx="6"/>
  <text x="340" y="90" font-size="16" text-anchor="middle">iii</text>
  <text class="h" x="340" y="112" text-anchor="middle">Em</text>
  <text class="s" x="340" y="132" text-anchor="middle">3</text>

  <rect class="chip" x="380" y="64" width="56" height="82" rx="6"/>
  <text x="408" y="90" font-size="16" text-anchor="middle">IV</text>
  <text class="h" x="408" y="112" text-anchor="middle">F</text>
  <text class="s" x="408" y="132" text-anchor="middle">4</text>

  <rect class="chip" x="448" y="64" width="56" height="82" rx="6"/>
  <text x="476" y="90" font-size="16" text-anchor="middle">V</text>
  <text class="h" x="476" y="112" text-anchor="middle">G</text>
  <text class="s" x="476" y="132" text-anchor="middle">5</text>

  <rect class="chip" x="516" y="64" width="56" height="82" rx="6"/>
  <text x="544" y="90" font-size="16" text-anchor="middle">vi</text>
  <text class="h" x="544" y="112" text-anchor="middle">Am</text>
  <text class="s" x="544" y="132" text-anchor="middle">6</text>

  <rect class="chip" x="584" y="64" width="56" height="82" rx="6"/>
  <text x="612" y="90" font-size="16" text-anchor="middle">vii°</text>
  <text class="h" x="612" y="112" text-anchor="middle">Bdim</text>
  <text class="s" x="612" y="132" text-anchor="middle">7</text>

  <text class="s" x="176" y="168">uppercase = major triad, lowercase = minor, ° = diminished</text>

  <!-- secondary dominant -->
  <rect class="alt" x="660" y="64" width="268" height="104" rx="10"/>
  <text class="h" x="676" y="88">V/V — a secondary dominant</text>
  <text class="s" x="676" y="112">In C major that is D7: the dominant</text>
  <text class="s" x="676" y="128">of G, read in the key it points at</text>
  <text class="s" x="676" y="144">rather than in C.</text>

  <!-- function bands -->
  <text class="lbl" x="32" y="203">tonic</text>
  <line class="rule" x1="232" y1="199" x2="312" y2="199"/>
  <line class="rule" x1="368" y1="199" x2="516" y2="199"/>
  <rect class="fill1" x="176" y="186" width="56" height="26" rx="6"/>
  <text class="h" x="204" y="203" text-anchor="middle">I</text>
  <rect class="fill1" x="312" y="186" width="56" height="26" rx="6"/>
  <text class="h" x="340" y="203" text-anchor="middle">iii</text>
  <rect class="fill1" x="516" y="186" width="56" height="26" rx="6"/>
  <text class="h" x="544" y="203" text-anchor="middle">vi</text>
  <text class="s" x="660" y="203">home; where a phrase comes to rest</text>

  <text class="lbl" x="32" y="231">predominant</text>
  <text class="lbl" x="32" y="244">(subdominant)</text>
  <line class="rule" x1="300" y1="233" x2="380" y2="233"/>
  <rect class="fill2" x="244" y="220" width="56" height="26" rx="6"/>
  <text class="h" x="272" y="237" text-anchor="middle">ii</text>
  <rect class="fill2" x="380" y="220" width="56" height="26" rx="6"/>
  <text class="h" x="408" y="237" text-anchor="middle">IV</text>
  <text class="s" x="660" y="237">leads to the dominant</text>

  <text class="lbl" x="32" y="271">dominant</text>
  <line class="rule" x1="504" y1="267" x2="584" y2="267"/>
  <rect class="fill1" x="448" y="254" width="56" height="26" rx="6"/>
  <text class="h" x="476" y="271" text-anchor="middle">V</text>
  <rect class="fill1" x="584" y="254" width="56" height="26" rx="6"/>
  <text class="h" x="612" y="271" text-anchor="middle">vii°</text>
  <text class="s" x="660" y="271">pulls back to the tonic</text>

  <text class="s" x="480" y="308" text-anchor="middle">A functional reading presupposes tonal material; <tspan class="mono">supportsFunctionalHarmony</tspan> says whether a named scale admits one at all.</text>
</svg>
