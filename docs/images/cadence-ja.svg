  <text class="s" x="828" y="280" text-anchor="middle">ドミナントが主和音以外へ</text>
  <text class="s" x="828" y="294" text-anchor="middle">解決する</text>

  <text class="s" x="480" y="342" text-anchor="middle">転回形や、ドミナントの代わりに置かれた導音上の和音は、和音だけで不完全形と判定されます。</text>
  <text class="s" x="480" y="358" text-anchor="middle">どちらでもない場合はソプラノを決めるボイシングが要るので、それが無ければ判定は null のまま返ります。</text>
