<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">音階・度数・旋法</title>
  <desc id="dsc">上段は C メジャースケール C D E F G A B C を示し、隣り合う音の間隔を全音・全音・半音・全音・全音・全音・半音と記します。その下に最初の 7 音の度数 1 から 7 と、主音から導音までの名称を並べます。下のグループは同じ 7 音を別の音から読んだもので、C から始まるイオニア、D から始まるドリア、A から始まるエオリアを、それぞれの全音・半音の並びとともに示します。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="380" rx="12"/>

  <text class="h" x="32" y="40">音階・度数・旋法</text>
  <text class="s" x="928" y="40" text-anchor="end">H = 半音（半音1つ）· W = 全音（半音2つ）</text>

  <!-- row 1: the C major scale -->
  <text class="h" x="44" y="93">C メジャー</text>

  <rect class="chip" x="160" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="190" y="93" text-anchor="middle">C</text>
  <rect class="chip" x="258" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="288" y="93" text-anchor="middle">D</text>
  <rect class="chip" x="356" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="386" y="93" text-anchor="middle">E</text>
  <rect class="chip" x="454" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="484" y="93" text-anchor="middle">F</text>
  <rect class="chip" x="552" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="582" y="93" text-anchor="middle">G</text>
  <rect class="chip" x="650" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="680" y="93" text-anchor="middle">A</text>
  <rect class="chip" x="748" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="778" y="93" text-anchor="middle">B</text>
  <rect class="chip" x="846" y="72" width="60" height="32" rx="6"/>
  <text class="h" x="876" y="93" text-anchor="middle">C</text>

  <text class="lbl" x="239" y="93" text-anchor="middle">W</text>
  <text class="lbl" x="337" y="93" text-anchor="middle">W</text>
  <text class="lbl" x="435" y="93" text-anchor="middle">H</text>
  <text class="lbl" x="533" y="93" text-anchor="middle">W</text>
  <text class="lbl" x="631" y="93" text-anchor="middle">W</text>
  <text class="lbl" x="729" y="93" text-anchor="middle">W</text>
  <text class="lbl" x="827" y="93" text-anchor="middle">H</text>

  <!-- row 2: degrees -->
  <text class="h" x="190" y="126" text-anchor="middle">1</text>
  <text class="s" x="190" y="142" text-anchor="middle">主音</text>
  <text class="h" x="288" y="126" text-anchor="middle">2</text>
  <text class="s" x="288" y="142" text-anchor="middle">上主音</text>
  <text class="h" x="386" y="126" text-anchor="middle">3</text>
  <text class="s" x="386" y="142" text-anchor="middle">中音</text>
  <text class="h" x="484" y="126" text-anchor="middle">4</text>
  <text class="s" x="484" y="142" text-anchor="middle">下属音</text>
  <text class="h" x="582" y="126" text-anchor="middle">5</text>
  <text class="s" x="582" y="142" text-anchor="middle">属音</text>
  <text class="h" x="680" y="126" text-anchor="middle">6</text>
  <text class="s" x="680" y="142" text-anchor="middle">下中音</text>
  <text class="h" x="778" y="126" text-anchor="middle">7</text>
  <text class="s" x="778" y="142" text-anchor="middle">導音</text>

  <!-- row 3: modes -->
  <rect class="grp" x="32" y="152" width="896" height="184" rx="10"/>
  <text class="lbl" x="48" y="176">同じ7音、どの音を中心にするか</text>

  <text class="h" x="44" y="204">イオニア（C）</text>
  <rect class="chip" x="160" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="190" y="204" text-anchor="middle">C</text>
  <rect class="chip" x="258" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="288" y="204" text-anchor="middle">D</text>
  <rect class="chip" x="356" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="386" y="204" text-anchor="middle">E</text>
  <rect class="chip" x="454" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="484" y="204" text-anchor="middle">F</text>
  <rect class="chip" x="552" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="582" y="204" text-anchor="middle">G</text>
  <rect class="chip" x="650" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="680" y="204" text-anchor="middle">A</text>
  <rect class="chip" x="748" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="778" y="204" text-anchor="middle">B</text>
  <rect class="chip" x="846" y="186" width="60" height="26" rx="6"/>
  <text class="h" x="876" y="204" text-anchor="middle">C</text>
  <text class="lbl" x="239" y="222" text-anchor="middle">W</text>
  <text class="lbl" x="337" y="222" text-anchor="middle">W</text>
  <text class="lbl" x="435" y="222" text-anchor="middle">H</text>
  <text class="lbl" x="533" y="222" text-anchor="middle">W</text>
  <text class="lbl" x="631" y="222" text-anchor="middle">W</text>
  <text class="lbl" x="729" y="222" text-anchor="middle">W</text>
  <text class="lbl" x="827" y="222" text-anchor="middle">H</text>

  <text class="h" x="44" y="254">ドリア（D）</text>
  <rect class="chip" x="160" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="190" y="254" text-anchor="middle">D</text>
  <rect class="chip" x="258" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="288" y="254" text-anchor="middle">E</text>
  <rect class="chip" x="356" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="386" y="254" text-anchor="middle">F</text>
  <rect class="chip" x="454" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="484" y="254" text-anchor="middle">G</text>
  <rect class="chip" x="552" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="582" y="254" text-anchor="middle">A</text>
  <rect class="chip" x="650" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="680" y="254" text-anchor="middle">B</text>
  <rect class="chip" x="748" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="778" y="254" text-anchor="middle">C</text>
  <rect class="chip" x="846" y="236" width="60" height="26" rx="6"/>
  <text class="h" x="876" y="254" text-anchor="middle">D</text>
  <text class="lbl" x="239" y="272" text-anchor="middle">W</text>
  <text class="lbl" x="337" y="272" text-anchor="middle">H</text>
  <text class="lbl" x="435" y="272" text-anchor="middle">W</text>
  <text class="lbl" x="533" y="272" text-anchor="middle">W</text>
  <text class="lbl" x="631" y="272" text-anchor="middle">W</text>
  <text class="lbl" x="729" y="272" text-anchor="middle">H</text>
  <text class="lbl" x="827" y="272" text-anchor="middle">W</text>

  <text class="h" x="44" y="304">エオリア（A）</text>
  <rect class="chip" x="160" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="190" y="304" text-anchor="middle">A</text>
  <rect class="chip" x="258" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="288" y="304" text-anchor="middle">B</text>
  <rect class="chip" x="356" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="386" y="304" text-anchor="middle">C</text>
  <rect class="chip" x="454" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="484" y="304" text-anchor="middle">D</text>
  <rect class="chip" x="552" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="582" y="304" text-anchor="middle">E</text>
  <rect class="chip" x="650" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="680" y="304" text-anchor="middle">F</text>
  <rect class="chip" x="748" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="778" y="304" text-anchor="middle">G</text>
  <rect class="chip" x="846" y="286" width="60" height="26" rx="6"/>
  <text class="h" x="876" y="304" text-anchor="middle">A</text>
  <text class="lbl" x="239" y="322" text-anchor="middle">W</text>
  <text class="lbl" x="337" y="322" text-anchor="middle">H</text>
  <text class="lbl" x="435" y="322" text-anchor="middle">W</text>
  <text class="lbl" x="533" y="322" text-anchor="middle">W</text>
  <text class="lbl" x="631" y="322" text-anchor="middle">H</text>
  <text class="lbl" x="729" y="322" text-anchor="middle">W</text>
  <text class="lbl" x="827" y="322" text-anchor="middle">W</text>

  <text class="s" x="480" y="352" text-anchor="middle">旋法は同じ素材の回転であり、どの度数を中心とするかだけが変わります。</text>
</svg>
