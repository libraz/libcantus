  <text class="s" x="728" y="294" text-anchor="middle">規則・該当する2声・発生位置を添えて報告される</text>

  <text class="s" x="480" y="334" text-anchor="middle"><tspan class="mono">checkPartWriting</tspan> は違反を報告するだけで、渡した課題はそのまま返します。減5度と増4度は</text>
  <text class="s" x="480" y="350" text-anchor="middle">同じ音程ではないため、綴りを持つ音を入力に取ります。</text>
