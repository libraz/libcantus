  <rect class="bg" x="0" y="0" width="960" height="368" rx="12"/>

  <text class="h" x="24" y="42">4声と、声部書法が見るもの</text>
  <text class="lbl" x="936" y="42" text-anchor="end">S ソプラノ・A アルト・T テノール・B バス</text>

