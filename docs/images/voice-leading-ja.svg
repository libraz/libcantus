<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">4声と、声部書法が見るもの</title>
  <desc id="dsc">上にあるほど音高が高い音高グリッドを2つ並べ、C3・C4・C5 に基準線を引いた図です。左（許容）はハ長調の I→V で、ソプラノ E5→D5、アルト C5→B4、テノールは G4 を保持、バスは C3→G3。バスが上行し、上声は下行または保持しています（反行と斜行）。右（不可）は規則に触れる2声だけを示し、バス C3→D3 とテノール G3→A3 が、同じ完全5度を同じ方向へ動かしています。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340" rx="12"/>

  <text class="h" x="24" y="40">4声と、声部書法が見るもの</text>
  <text class="lbl" x="936" y="40" text-anchor="end">上にあるほど音高が高い</text>

  <!-- accepted panel -->
  <rect class="card" x="24" y="52" width="444" height="200" rx="8"/>
  <text class="lbl" x="38" y="70">許容</text>
  <text class="h" x="200" y="70" text-anchor="middle">I — C</text>
  <text class="h" x="380" y="70" text-anchor="middle">V — G</text>

  <line class="seam" x1="150" y1="108.4" x2="430" y2="108.4"/>
  <line class="seam" x1="150" y1="173.2" x2="430" y2="173.2"/>
  <line class="seam" x1="150" y1="238" x2="430" y2="238"/>
  <text class="s" x="436" y="111.9">C5</text>
  <text class="s" x="436" y="176.7">C4</text>
  <text class="s" x="436" y="241.5">C3</text>

  <line class="ln" x1="200" y1="86.8" x2="380" y2="97.6"/>
  <circle class="ah" cx="200" cy="86.8" r="4"/>
  <circle class="ah" cx="380" cy="97.6" r="4"/>
  <text class="h" x="38" y="90.3">ソプラノ</text>
  <text class="s" x="96" y="90.3">E5 → D5</text>

  <line class="ln" x1="200" y1="108.4" x2="380" y2="113.8"/>
  <circle class="ah" cx="200" cy="108.4" r="4"/>
  <circle class="ah" cx="380" cy="113.8" r="4"/>
  <text class="h" x="38" y="111.9">アルト</text>
  <text class="s" x="96" y="111.9">C5 → B4</text>

  <line class="ln" x1="200" y1="135.4" x2="380" y2="135.4"/>
  <circle class="ah" cx="200" cy="135.4" r="4"/>
  <circle class="ah" cx="380" cy="135.4" r="4"/>
  <text class="h" x="38" y="138.9">テノール</text>
  <text class="s" x="96" y="138.9">G4 → G4</text>

  <line class="ln" x1="200" y1="238" x2="380" y2="200.2"/>
  <circle class="ah" cx="200" cy="238" r="4"/>
  <circle class="ah" cx="380" cy="200.2" r="4"/>
  <text class="h" x="38" y="241.5">バス</text>
  <text class="s" x="96" y="241.5">C3 → G3</text>

  <text class="lbl" x="24" y="272">バスが上行し、上声は下行または保持 — 反行と斜行</text>

  <!-- rejected panel -->
  <rect class="alt" x="492" y="52" width="444" height="200" rx="8"/>
  <text class="lbl" x="506" y="70">不可</text>
  <text class="s" x="668" y="70" text-anchor="middle">第1和音</text>
  <text class="s" x="848" y="70" text-anchor="middle">第2和音</text>

  <text class="warnt" font-size="10.5" x="506" y="130">並行5度 — 同じ完全5度が同じ方向へ動いている</text>

  <line class="seam" x1="618" y1="108.4" x2="898" y2="108.4"/>
  <line class="seam" x1="618" y1="173.2" x2="898" y2="173.2"/>
  <line class="seam" x1="618" y1="238" x2="898" y2="238"/>
  <text class="s" x="904" y="111.9">C5</text>
  <text class="s" x="904" y="176.7">C4</text>
  <text class="s" x="904" y="241.5">C3</text>

  <line class="ln2" x1="668" y1="200.2" x2="848" y2="189.4"/>
  <circle class="ah2" cx="668" cy="200.2" r="4"/>
  <circle class="ah2" cx="848" cy="189.4" r="4"/>
  <text class="h" x="506" y="203.7">テノール</text>
  <text class="s" x="564" y="203.7">G3 → A3</text>

  <line class="ln2" x1="668" y1="238" x2="848" y2="227.2"/>
  <circle class="ah2" cx="668" cy="238" r="4"/>
  <circle class="ah2" cx="848" cy="227.2" r="4"/>
  <text class="h" x="506" y="241.5">バス</text>
  <text class="s" x="564" y="241.5">C3 → D3</text>

  <path class="warn" d="M656,238 L648,238 L648,200.2 L656,200.2"/>
  <text class="mono" x="644" y="222.6" text-anchor="end">P5</text>
  <path class="warn" d="M860,227.2 L868,227.2 L868,189.4 L860,189.4"/>
  <text class="mono" x="874" y="211.8">P5</text>

  <text class="s" x="492" y="272">規則・該当する2声・発生位置を添えて報告される</text>

  <text class="s" x="480" y="300" text-anchor="middle"><tspan class="mono">checkPartWriting</tspan> は違反を報告するだけで、渡した課題はそのまま返します。減5度と増4度は同じ音程ではないため、</text>
  <text class="s" x="480" y="316" text-anchor="middle">綴りを持つ音を入力に取ります。</text>
</svg>
