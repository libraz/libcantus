  <text class="s" x="720" y="112" text-anchor="middle">第1和音</text>
  <text class="s" x="820" y="112" text-anchor="middle">第2和音</text>
  <text class="warnt" font-size="10.5" x="728" y="160" text-anchor="middle">並行5度 — 同じ完全5度が</text>
  <text class="warnt" font-size="10.5" x="728" y="174" text-anchor="middle">同じ方向へ動いている</text>
