<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">レイヤー構成と、各レイヤーが受け持つもの</title>
  <desc id="dsc">下から core、theory、analyze、generate の 4 つのレイヤーを積み上げた図です。各レイヤーには受け持つ範囲とインポート用のサブパスを添えています。右側の全高カードは model レイヤーで、他のレイヤーの上に載る不変のクラス API です。左端の矢印は、各レイヤーが下のレイヤーの上に積み上がることを示します。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="360" rx="12"/>

  <path class="ln" d="M 48 304 V 48" marker-end="url(#a)"/>
  <text class="lbl" x="34" y="174" text-anchor="middle" transform="rotate(-90 34 174)">各レイヤーは下のレイヤーの上に積み上がる</text>

  <rect class="grp" x="62" y="44" width="592" height="59" rx="8"/>
  <text class="lbl" x="76" y="63">generate</text>
  <text class="mono" x="142" y="63">@libraz/libcantus/generate</text>
  <rect class="chip" x="76" y="72" width="69" height="24" rx="5"/>
  <text class="s" x="110" y="89" text-anchor="middle">コード進行</text>
  <rect class="chip" x="153" y="72" width="48" height="24" rx="5"/>
  <text class="s" x="177" y="89" text-anchor="middle">モチーフ</text>
  <rect class="chip" x="209" y="72" width="90" height="24" rx="5"/>
  <text class="s" x="254" y="89" text-anchor="middle">リズムとドラム</text>
  <rect class="chip" x="307" y="72" width="48" height="24" rx="5"/>
  <text class="s" x="331" y="89" text-anchor="middle">ベース</text>
  <rect class="chip" x="363" y="72" width="48" height="24" rx="5"/>
  <text class="s" x="387" y="89" text-anchor="middle">対旋律</text>

  <rect class="grp" x="62" y="111" width="592" height="59" rx="8"/>
  <text class="lbl" x="76" y="130">analyze</text>
  <text class="mono" x="142" y="130">@libraz/libcantus/analyze</text>
  <rect class="chip" x="76" y="139" width="90" height="24" rx="5"/>
  <text class="s" x="121" y="156" text-anchor="middle">和音・調の検出</text>
  <rect class="chip" x="174" y="139" width="79" height="24" rx="5"/>
  <text class="s" x="213" y="156" text-anchor="middle">タイムライン</text>
  <rect class="chip" x="261" y="139" width="37" height="24" rx="5"/>
  <text class="s" x="279" y="156" text-anchor="middle">形式</text>
  <rect class="chip" x="306" y="139" width="79" height="24" rx="5"/>
  <text class="s" x="345" y="156" text-anchor="middle">編成レポート</text>

  <rect class="grp" x="62" y="178" width="592" height="59" rx="8"/>
  <text class="lbl" x="76" y="197">theory</text>
  <text class="mono" x="142" y="197">@libraz/libcantus/theory</text>
  <rect class="chip" x="76" y="206" width="69" height="24" rx="5"/>
  <text class="s" x="110" y="223" text-anchor="middle">音階と旋法</text>
  <rect class="chip" x="153" y="206" width="37" height="24" rx="5"/>
  <text class="s" x="171" y="223" text-anchor="middle">和音</text>
  <rect class="chip" x="198" y="206" width="37" height="24" rx="5"/>
  <text class="s" x="216" y="223" text-anchor="middle">綴り</text>
  <rect class="chip" x="243" y="206" width="58" height="24" rx="5"/>
  <text class="s" x="272" y="223" text-anchor="middle">和声規則</text>
  <rect class="chip" x="309" y="206" width="79" height="24" rx="5"/>
  <text class="s" x="348" y="223" text-anchor="middle">ボイシング</text>

  <rect class="grp" x="62" y="245" width="592" height="59" rx="8"/>
  <text class="lbl" x="76" y="264">core</text>
  <text class="mono" x="142" y="264">@libraz/libcantus/core</text>
  <rect class="chip" x="76" y="273" width="79" height="24" rx="5"/>
  <text class="s" x="115" y="290" text-anchor="middle">ピッチと音程</text>
  <rect class="chip" x="163" y="273" width="79" height="24" rx="5"/>
  <text class="s" x="202" y="290" text-anchor="middle">拍子とテンポ</text>
  <rect class="chip" x="250" y="273" width="37" height="24" rx="5"/>
  <text class="s" x="268" y="290" text-anchor="middle">調律</text>
  <rect class="chip" x="295" y="273" width="37" height="24" rx="5"/>
  <text class="s" x="313" y="290" text-anchor="middle">検証</text>
  <rect class="chip" x="340" y="273" width="37" height="24" rx="5"/>
  <text class="s" x="358" y="290" text-anchor="middle">楽器</text>

  <rect class="card" x="666" y="44" width="270" height="260" rx="8"/>
  <text class="lbl" x="682" y="72">model</text>
  <text class="mono" x="682" y="92">@libraz/libcantus/model</text>
  <text class="s" x="682" y="120">不変のクラス API</text>
  <rect class="chip" x="682" y="136" width="74" height="28" rx="5"/>
  <text class="s" x="719" y="154" text-anchor="middle">Note</text>
  <rect class="chip" x="764" y="136" width="74" height="28" rx="5"/>
  <text class="s" x="801" y="154" text-anchor="middle">Chord</text>
  <rect class="chip" x="846" y="136" width="74" height="28" rx="5"/>
  <text class="s" x="883" y="154" text-anchor="middle">Key</text>
  <rect class="chip" x="682" y="172" width="74" height="28" rx="5"/>
  <text class="s" x="719" y="190" text-anchor="middle">Score</text>
  <rect class="chip" x="764" y="172" width="74" height="28" rx="5"/>
  <text class="s" x="801" y="190" text-anchor="middle">Timeline</text>
  <rect class="chip" x="846" y="172" width="74" height="28" rx="5"/>
  <text class="s" x="883" y="190" text-anchor="middle">Composer</text>
  <text class="s" x="682" y="232">他のレイヤーが扱う対象ごとに</text>
  <text class="s" x="682" y="247">1 クラスを用意し、それらの</text>
  <text class="s" x="682" y="262">関数への薄い層になっています</text>

  <text class="s" x="480" y="326" text-anchor="middle">パッケージのルートはすべてのレイヤーを再エクスポートします。サブパスからのインポートはパッケージング上の選択であり、別の API ではありません。</text>
</svg>
