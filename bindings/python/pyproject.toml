[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libcantus"
version = "1.4.3"
description = "Detect chords, keys, Roman numerals and cadences in MIDI note events from Python, and generate parts against that harmony. Binding of the libcantus C++ core."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = [
  "music-theory",
  "music",
  "midi",
  "chords",
  "chord-detection",
  "key-detection",
  "harmonic-analysis",
  "roman-numeral-analysis",
  "cadence",
  "chord-progression",
  "voice-leading",
  "counterpoint",
  "scales",
  "reharmonization",
  "generative-music",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/libraz/libcantus"
Documentation = "https://github.com/libraz/libcantus/blob/main/docs/en/python.md"
Repository = "https://github.com/libraz/libcantus"
Changelog = "https://github.com/libraz/libcantus/blob/main/CHANGELOG.md"
Issues = "https://github.com/libraz/libcantus/issues"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "ruff>=0.17.6",
  "mypy>=2.4",
  "hatchling>=1.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libcantus"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]
mypy_path = "src"
