[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libcantus"
version = "1.3.0"
description = "Music-theory analysis and generation: Python binding of the libcantus C++ core."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.rye]
managed = true
dev-dependencies = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "hatchling>=1.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libcantus"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]

[tool.mypy]
strict = true
files = ["src", "tests", "hatch_build.py"]
mypy_path = "src"
