name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (major matches mise.toml)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read the pinned Emscripten version
        id: emsdk
        run: echo "version=$(sed -n 's/^EMSDK_VERSION := //p' mk/toolchain.mk)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache

      - name: Release checks (parity, versions, wasm size)
        run: make release-check

      - run: yarn lint
      - run: yarn workspace @libraz/libcantus typecheck
      - run: yarn workspace @libraz/libcantus test
      - run: yarn workspace @libraz/libcantus build

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./ts/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Build the exact package artifact
        working-directory: ts
        run: npm pack --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-ts
          path: 'ts/*.tgz'
          if-no-files-found: error
          retention-days: 1

  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (major matches mise.toml)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read the pinned Emscripten version
        id: emsdk
        run: echo "version=$(sed -n 's/^EMSDK_VERSION := //p' mk/toolchain.mk)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache

      - run: make test-wasm

      - name: Verify tag matches the wasm package version
        run: |
          pkg_version="$(node -p "require('./bindings/wasm/package.json').version")"
          if [ "$pkg_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match bindings/wasm version $pkg_version" >&2
            exit 1
          fi

      - name: Build the exact package artifact
        working-directory: bindings/wasm
        run: npm pack --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-wasm
          path: 'bindings/wasm/*.tgz'
          if-no-files-found: error
          retention-days: 1

  build-wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      JOBS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            plat: manylinux_2_28_aarch64
          - os: macos-latest
            plat: macosx
    steps:
      - uses: actions/checkout@v7

      # Linux wheels are built inside the manylinux image so the bundled library links against
      # an old glibc, then repaired to the platform tag.
      - name: Build the wheel (manylinux)
        if: startsWith(matrix.plat, 'manylinux')
        run: |
          docker run --rm -e JOBS -v "$PWD:/src" -w /src "quay.io/pypa/${{ matrix.plat }}" bash -ec '
            PY=/opt/python/cp312-cp312/bin
            $PY/pip install --quiet cmake hatchling build auditwheel
            export PATH="$PY:$PATH"
            make build-shared NICE=
            (cd bindings/python && python -m build --wheel --no-isolation --outdir /tmp/raw)
            auditwheel repair --plat ${{ matrix.plat }} -w dist /tmp/raw/*.whl
          '

      - name: Setup Python
        if: matrix.plat == 'macosx'
        uses: actions/setup-python@v7
        with:
          python-version-file: bindings/python/.python-version

      - name: Build the wheel (macOS)
        if: matrix.plat == 'macosx'
        run: |
          make build-shared
          python3 -m pip install --quiet hatchling build
          (cd bindings/python && python3 -m build --wheel --no-isolation --outdir ../../dist)

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  build-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      JOBS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cantus-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: cantus-linux-aarch64
          - os: macos-latest
            asset: cantus-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - run: make release

      - name: Package the binary
        run: |
          mkdir -p dist
          cp build-release/tools/cli/cantus "dist/${{ matrix.asset }}"
          cp LICENSE NOTICE dist/
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}" LICENSE NOTICE
          rm "dist/${{ matrix.asset }}" dist/LICENSE dist/NOTICE

      - name: Upload CLI asset
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: [verify, build-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: npm-package-*
          merge-multiple: true

      - name: Setup Node.js for npm
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the version bundled
      # with Node 22 can be older, so pin a known compatible major here.
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11

      # No NODE_AUTH_TOKEN: authentication is via OIDC trusted publishing.
      # Re-runs are idempotent: an already published version is skipped.
      - name: Publish verified artifacts to npm
        run: |
          count=0
          for tarball in ./*.tgz; do
            metadata="$(tar -xOf "$tarball" package/package.json)"
            name="$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$metadata")"
            version="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$metadata")"
            count=$((count + 1))
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping publish."
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 verified npm tarballs, found $count" >&2
            exit 1
          fi

  publish-pypi:
    needs: [verify, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The GitHub Release is created only after npm and PyPI are confirmed published.
  # If release creation fails, rerunning safely skips them and retries here.
  release:
    needs: [publish-npm, publish-pypi, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download CLI assets
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: assets

      - name: Create or reconcile GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
