name: CI

# Work lands on develop and reaches main only as a release, so develop is where
# a regression is still cheap to find. Gating main alone let a release cycle's
# worth of commits accumulate unverified, and the whole of it surfaced at once
# on the release itself.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    # The published `engines` range is `>=22`, so every supported major is
    # exercised. Coverage is uploaded once, from the ubuntu/22 combination that
    # matches mise.toml.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - run: yarn lint
      - run: yarn workspace @libraz/libcantus typecheck
      - run: yarn workspace @libraz/libcantus test:coverage

      # The reference build validates every link and every required doc comment
      # and treats those warnings as errors, so it fails on a symbol that lost
      # its comment or a `{@link}` naming something the barrels no longer carry.
      # Run before merge rather than only on the pages deploy.
      - name: Build the API reference
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: yarn workspace @libraz/libcantus docs

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: codecov/codecov-action@v7
        with:
          files: ./ts/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - run: yarn workspace @libraz/libcantus build

  # The C++ core and every native surface, on the three native environments. Spec runs against the
  # Node addon, and the recorded call corpus is replayed through the C ABI in Debug and Release.
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JOBS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: true
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (major matches mise.toml)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Python (version from bindings/python/.python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: bindings/python/.python-version

      # Pinned to the versions the local format and lint run, not whatever the image's apt carries.
      - name: Install the C++ format and lint tools
        if: matrix.gate
        run: |
          python3 -m pip install clang-format==18.1.8 clang-tidy==18.1.8
          clang-format --version
          clang-tidy --version

      - name: Core, Debug
        run: make test-cxx

      - name: Core, Release
        run: make test-cxx BUILD_DIR=build-release BUILD_TYPE=Release

      - name: Conformance gates and install check
        run: make conformance-fast

      - run: python3 tools/conformance/check_error_tables.py

      - name: Generators, manifest, file map and cross-implementation parity
        run: make parity

      # The corpus is not tracked; record it from pure TS through the facade before replaying it.
      - name: Record the call corpus
        run: make corpus

      - name: Corpus replay through the C ABI, Debug
        run: make corpus-check UNIT=all

      - name: Corpus replay through the C ABI, Release
        run: make corpus-check UNIT=all BUILD_DIR=build-release BUILD_TYPE=Release

      - run: node tools/corpus/coverage.mjs

      - run: make test-cli

      - run: make test-python

      - run: make test-node

      - name: Spec against the Node addon
        run: make spec-ready IMPL=node

      - name: Spec counts match pure TS
        run: node tools/spec/count.mjs --compare node

      - name: Format and lint
        if: matrix.gate
        run: |
          make format-check
          make lint

  # The WebAssembly build with the pinned Emscripten SDK.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (major matches mise.toml)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          yarn --version

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read the pinned Emscripten version
        id: emsdk
        run: echo "version=$(sed -n 's/^EMSDK_VERSION := //p' mk/toolchain.mk)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache

      - run: make wasm

      - run: python3 tools/conformance/check_wasm_flags.py

      - run: make test-wasm

      - name: Spec against the WebAssembly module
        run: make spec-ready IMPL=wasm

      - name: Spec counts match pure TS
        run: node tools/spec/count.mjs --compare wasm

  # Workflows may only call make and yarn targets that exist, and must be valid.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: python3 tools/release/check_workflow_targets.py

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
